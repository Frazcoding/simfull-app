[project]
name = "simfull-app"
version = "0.1.0"
description = "Full simulation software: multi-zone network model, spatial fields, 2D/3D geometry and STL import"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Fraser McLellan" }]
dependencies = [
    "simcore",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "numpy>=1.26",
    "scipy>=1.12",
    "pydantic>=2.0",
]

[project.scripts]
simfull-app = "simfull_app.server:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "jsonschema>=4.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/simfull_app"]

[tool.uv.sources]
simcore = { path = "vendor/simcore", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::Warning"]
