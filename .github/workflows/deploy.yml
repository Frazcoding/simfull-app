# Deploy simfull-app to Google Cloud Run whenever main changes or manually.
# Uses Workload Identity Federation (no long-lived Google service account keys stored).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      simcore_ref:
        description: simcore branch or tag to deploy with
        default: main

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  PROJECT: simcore-app
  REGION: europe-west1
  SERVICE: simfull-app
  IMAGE_REPO: europe-west1-docker.pkg.dev/simcore-app/cloud-run-source-deploy/simfull-app

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Check out simcore into vendor/simcore
        uses: actions/checkout@v4
        with:
          repository: Frazcoding/simcore
          ref: ${{ inputs.simcore_ref || 'main' }}
          token: ${{ secrets.SIMCORE_TOKEN }}
          path: vendor/simcore

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/284349057602/locations/global/workloadIdentityPools/github/providers/simfull-app
          service_account: github-deploy@simcore-app.iam.gserviceaccount.com
          token_format: access_token

      - uses: google-github-actions/setup-gcloud@v2
        with:
          skip_install: true

      - uses: docker/login-action@v3
        with:
          registry: europe-west1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push (cached layers)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_REPO }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Cloud Run
        env:
          IMAGE: ${{ env.IMAGE_REPO }}:${{ github.sha }}
          SKIP_SETUP: "1"
        run: bash deploy/cloud-run.sh

      - name: Check the deployed service answers
        run: |
          url="$(gcloud run services describe "$SERVICE" --project "$PROJECT" --region "$REGION" --format 'value(status.url)')"
          for i in 1 2 3 4 5 6; do curl -fsS "$url/api/health" && exit 0; sleep 10; done
          exit 1
